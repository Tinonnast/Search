<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/middle.css">
  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
</head>

<body>
  <div id="top">
    <div id="search-box">
      <h1>Search</h1>
      <div id="input-fields">
        <input placeholder="Type here to start Searching..." type="text">
        <button>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" color="#ffffff" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 17L21 21"></path>
          <path d="M19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19C15.4183 19 19 15.4183 19 11Z"></path>
          </svg>
        </button>
      </div>
    </div>


    <div id="search-mode">
      <button>Web</button>
      <button>Images</button>
      <button>Videos</button>
      <button>News</button>
    </div>
    <div id="separator"></div>
  </div>

  <div id="bottom">
    <div id="left">
    <ul id="results"></ul>
    </div>

    <div id="middle">
      <div id="ai-assist">
        <h2>AI Assist</h2>
        <p>A fish is an aquatic, gill-bearing vertebrate animal that typically lacks limbs with digits and is found in both fresh and salt waters. There are approximately 34,000 species of fish, making them the largest group of vertebrates.</p>
        <button id="expand">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#e3e3e3"><path d="M24 24H0V0h24v24z" fill="none" opacity=".87"/><path d="M7.38 21.01c.49.49 1.28.49 1.77 0l8.31-8.31c.39-.39.39-1.02 0-1.41L9.15 2.98c-.49-.49-1.28-.49-1.77 0s-.49 1.28 0 1.77L14.62 12l-7.25 7.25c-.48.48-.48 1.28.01 1.76z"/></svg>
        </button>
      </div>

    </div>

  </div>
</body>


<script src="js/app.js"></script>
</html>
